<text x="510" y="192" font-size="18" font-weight="bold">Stride 2: next start = 2</text>
<text x="35" y="220" font-size="17" font-weight="normal">Green: current 3-cell window. Gold: next window. The 2D rule also applies vertically.</text>
<line x1="30" y1="245" x2="950" y2="245" stroke="#a8bbc6"/>
