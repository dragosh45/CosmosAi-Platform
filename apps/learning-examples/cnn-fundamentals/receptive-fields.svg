<rect x="90" y="135" width="165" height="12" fill="#e39e25"/>
<line x1="43" y1="160" x2="98" y2="160" stroke="#255872" stroke-width="3" marker-end="url(#arrow)"/>
<text x="35" y="192" font-size="18" font-weight="bold">Stride 1: next start = 1</text>
<rect x="510" y="80" width="55" height="45" fill="white" stroke="#829eaf"/>
<text x="532" y="109" font-size="18" font-weight="normal">0</text>
