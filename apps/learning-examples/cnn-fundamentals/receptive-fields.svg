<text x="35" y="610" font-size="20" font-weight="bold">Together their input patches cover 5 x 5: 3 + 2 = 5, not 3 x 3 = 9.</text>
<text x="35" y="640" font-size="15" font-weight="normal">Teaching calculation: both kernels contain ones; bias 0; valid convolution; no dilation or activation.</text>
