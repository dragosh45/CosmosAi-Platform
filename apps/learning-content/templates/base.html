<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | CosmosAI</title>
  <link rel="stylesheet" href="/assets/learning.css">
  <script src="/assets/vendor/lucide.min.js" defer></script>
  <script src="/assets/learning.js" defer></script>
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="site-header"><nav aria-label="Main navigation">
    <a href="/">Galaxy Classifier</a><a href="/learn/">CNN Learning Replay</a>
    <a href="/learn/concepts/" {% if active == 'concepts' %}aria-current="page"{% endif %}>Concepts Explanations</a>
    <a href="/learn/diagrams/" {% if active == 'diagrams' %}aria-current="page"{% endif %}>Diagrams</a>
  </nav></header>
  <main>{% block body %}{% endblock %}</main>
  <footer>CosmosAI / Learning notes <a class="return-replay" href="/learn/?resume=1" hidden>Return to selected replay calculation</a></footer>
</body></html>
