apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/description: CosmosAI galaxy classifier and CNN learning site
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/maxScale: "1"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/container-dependencies: '{"api-gateway":["inference-router"],"inference-router":["galaxy-classifier"]}'
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 120
      containers:
        - name: api-gateway
          image: ${REGISTRY}/gateway:${TAG}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: COSMOSAI_ROUTER_BASE_URL
              value: http://127.0.0.1:8001
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 3
            failureThreshold: 20
        - name: inference-router
          image: ${REGISTRY}/router:${TAG}
          env:
            - name: PORT
              value: "8001"
            - name: COSMOSAI_GALAXY_BASE_URL
              value: http://127.0.0.1:8002
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            timeoutSeconds: 3
            periodSeconds: 3
            failureThreshold: 20
        - name: galaxy-classifier
          image: ${REGISTRY}/classifier:${TAG}
          env:
            - name: PORT
              value: "8002"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /model
              port: 8002
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 30
