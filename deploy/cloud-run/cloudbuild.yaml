substitutions:
  _REGION: europe-west1
  _REPOSITORY: cosmosai
  _TAG: manual

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --file
      - apps/api-gateway/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/gateway:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --file
      - apps/inference-router/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/router:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --file
      - apps/galaxy-classifier-service/Dockerfile.release
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/classifier:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/gateway:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/router:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/classifier:${_TAG}
